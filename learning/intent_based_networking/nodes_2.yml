      priv: AES128
      collector: 10.0.0.100
- hostname: nyc-branch1-rtr01
  platform: cisco_ios
  role: wan_router
  site: nyc-branch1
  intent:
  - INTENT-RTG-03
  - INTENT-SEG-01
  - INTENT-MGMT-01
  - INTENT-MGMT-02
  - INTENT-IP-01
  loopback:
    address: 10.2.254.1/32
  interfaces:
  - name: GigabitEthernet0/0
    description: WAN uplink — primary carrier
    address: dhcp
    zone: wan
    mode: routed
    ospf:
      enabled: false
  - name: GigabitEthernet0/2
    description: WAN uplink — secondary carrier
    address: dhcp
    zone: wan
    mode: routed
    ospf:
      enabled: false
  - name: GigabitEthernet0/1
    description: LAN trunk to branch switches
    zone: corporate
    mode: trunk
    ospf:
      enabled: true
      area: 0
      network_type: broadcast
  - name: GigabitEthernet0/1.20
    description: Corporate VLAN 20
    address: 10.2.20.1/24
    vlan: 20
    zone: corporate
    mode: routed
  ospf:
    process_id: 1
    router_id: 10.2.254.1
    area: 0
    default_route: inject
  acls:
  - name: ACL_CORPORATE_IN
    default_action: deny
    entries:
    - seq: 10
      action: permit
      protocol: tcp
      src: 10.2.20.0/24
      dst: 10.2.20.0/24
      dst_port: any
      comment: 'REQ-SEC-01: intra-corporate east-west'
    - seq: 20
      action: permit
      protocol: tcp
      src: 10.2.20.0/24
      dst: 10.0.0.100
      dst_port: 514
      comment: 'REQ-OPS-03: syslog to primary collector'
    - seq: 9999
      action: deny
      protocol: ip
      src: any
      dst: any
      comment: 'REQ-SEC-02: explicit deny-all'
  management:
    address: 10.2.20.1/24
    ssh_source_interface: Loopback0
    syslog_servers: &id001
    - 10.0.0.100
    - 10.0.0.101
    snmp: &id002
      version: v3
      auth: SHA
      priv: AES128
      collector: 10.0.0.100
- hostname: nyc-branch1-sw01
