- hostname: lon-branch-rtr01
  platform: cisco_ios
  role: wan_router
  site: lon-branch1
  intent:
  - INTENT-RTG-03
  - INTENT-NET-05
  loopback:
    address: 10.1.254.1/32
  interfaces:
  - name: GigabitEthernet0/0
    description: WAN uplink — carrier A
    address: dhcp
    zone: wan
    mode: routed
    ospf:
      enabled: false
  - name: GigabitEthernet0/1
    description: LAN trunk to branch switches
    zone: corporate
    mode: trunk
    ospf:
      enabled: true
      area: 0
      network_type: broadcast
  - name: GigabitEthernet0/1.20
    description: Corporate VLAN 20
    address: 10.1.20.1/24
    vlan: 20
    zone: corporate
    mode: routed
  ospf:
    process_id: 1
    router_id: 10.1.254.1
    area: 0
    default_route: inject
  management:
    address: 10.1.0.1/24
    ssh_source_interface: Loopback0
    syslog_servers:
    - 10.0.0.100
    - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128
      collector: 10.0.0.100
- hostname: lon-branch-sw01
  platform: cisco_ios
  role: access_switch
  site: lon-branch1
  intent:
  - INTENT-RTG-03
  - INTENT-SEG-01
  interfaces:
  - name: GigabitEthernet0/1
    description: Uplink to branch router
    zone: corporate
    mode: trunk
    allowed_vlans:
    - 20
  - name: GigabitEthernet0/2
    description: Staff desks
    zone: corporate
    mode: access
    vlan: 20
  ospf:
    process_id: 1
    router_id: 10.1.254.11
    area: 0
  management:
    address: 10.1.0.11/24
    ssh_source_interface: Vlan20
    syslog_servers:
    - 10.0.0.100
    - 10.0.0.101
