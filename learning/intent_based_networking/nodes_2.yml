nodes:
- hostname: spine01
  platform: arista_eos
  role: spine
  site: lon-dc1
  intent:
  - INTENT-TOPO-01
  - INTENT-RTG-01
  - INTENT-RTG-02
  loopback:
    address: 10.0.254.1/32
  bgp:
    asn: 65001
    router_id: 10.0.254.1
    peers:
    - peer_ip: 10.0.255.0
      peer_asn: 65101
      description: leaf01 underlay
      address_families:
      - ipv4_unicast
    - peer_ip: 10.0.255.4
      peer_asn: 65102
      description: leaf02 underlay
      address_families:
      - ipv4_unicast
    - peer_ip: 10.0.255.8
      peer_asn: 65201
      description: border-leaf01 underlay
      address_families:
      - ipv4_unicast
    - peer_ip: 10.0.255.12
      peer_asn: 65202
      description: border-leaf02 underlay
      address_families:
      - ipv4_unicast
    evpn:
      enabled: true
      role: route_server
      peers:
      - peer_ip: 10.0.254.11
        peer_asn: 65101
        description: leaf01 EVPN
      - peer_ip: 10.0.254.12
        peer_asn: 65102
        description: leaf02 EVPN
      - peer_ip: 10.0.254.21
        peer_asn: 65201
        description: border-leaf01 EVPN
      - peer_ip: 10.0.254.22
        peer_asn: 65202
        description: border-leaf02 EVPN
  management:
    vrf: MGMT
    address: 10.0.0.1/24
    ssh_vrf: MGMT
    syslog_servers:
    - 10.0.0.100
    - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128
      collector: 10.0.0.100
