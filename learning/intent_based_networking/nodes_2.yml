- hostname: leaf01
  platform: arista_eos
  role: leaf
  site: lon-dc1
  intent:
  - INTENT-TOPO-01
  - INTENT-TOPO-02
  - INTENT-TOPO-03
  - INTENT-SEG-01
  - INTENT-SEG-02
  loopback:
    address: 10.0.254.11/32
  mlag:
    domain_id: MLAG_COMPUTE
    peer_address: 10.0.254.12
    peer_link: Port-Channel1
    local_interface: Vlan4094
    peer_link_members:
    - Ethernet49
    - Ethernet50
  vxlan:
    vtep_loopback: 10.0.254.11
    vlans:
    - vlan: 100
      vni: 100
      zone: trading
    - vlan: 200
      vni: 200
      zone: corporate
    - vlan: 300
      vni: 300
      zone: dmz
  vrfs:
  - name: TRADING
    vni: 10100
    zone: trading
  - name: CORPORATE
    vni: 10200
    zone: corporate
  interfaces:
  - name: Vlan100
    description: Trading zone SVI
    address: 10.0.10.1/24
    vrf: TRADING
    zone: trading
    mode: svi
    intent: INTENT-SEG-01
    acl_in: ACL_TRADING_IN
  - name: Vlan200
    description: Corporate zone SVI
    address: 10.0.20.1/24
    vrf: CORPORATE
    zone: corporate
    mode: svi
    intent: INTENT-SEG-01
    acl_in: ACL_CORPORATE_IN
  - name: Ethernet1
    description: Uplink to spine01
    address: 10.0.255.1/31
    zone: underlay
    mode: routed
  - name: Ethernet2
    description: Uplink to spine02
    address: 10.0.255.3/31
    zone: underlay
    mode: routed
  bgp:
    asn: 65101
    router_id: 10.0.254.11
    peers:
    - peer_ip: 10.0.255.0
      peer_asn: 65001
      description: spine01 underlay
      address_families:
      - ipv4_unicast
    - peer_ip: 10.0.255.2
      peer_asn: 65002
      description: spine02 underlay
      address_families:
      - ipv4_unicast
    evpn:
      enabled: true
      role: leaf
      peers:
      - peer_ip: 10.0.254.1
        peer_asn: 65001
        description: spine01 EVPN
      - peer_ip: 10.0.254.2
        peer_asn: 65002
        description: spine02 EVPN
  acls:
  - name: ACL_TRADING_IN
    default_action: deny
    entries:
    - seq: 10
      action: permit
      protocol: tcp
      src: 10.0.10.0/24
      dst: 10.0.10.0/24
      dst_port: any
      comment: 'REQ-SEC-01: intra-trading east-west'
    - seq: 20
      action: permit
      protocol: tcp
      src: 10.0.10.0/24
      dst: any
      dst_port: 443
      comment: 'REQ-BIZ-01: market data HTTPS feeds'
    - seq: 9999
      action: deny
      protocol: ip
      src: any
      dst: any
      comment: 'REQ-SEC-02: explicit deny-all'
  - name: ACL_CORPORATE_IN
    default_action: deny
    entries:
    - seq: 10
      action: permit
      protocol: tcp
      src: 10.0.20.0/24
      dst: 10.0.20.0/24
      dst_port: any
      comment: 'REQ-SEC-01: intra-corporate east-west'
    - seq: 9999
      action: deny
      protocol: ip
      src: any
      dst: any
      comment: 'REQ-SEC-02: explicit deny-all'
  management:
    vrf: MGMT
    address: 10.0.0.11/24
    ssh_vrf: MGMT
    syslog_servers:
    - 10.0.0.100
    - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128
      collector: 10.0.0.100
