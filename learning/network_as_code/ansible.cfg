[defaults]
# ============================================================
# ACME Investments – Ansible Configuration
# Network as Code
# ============================================================

inventory            = ./inventory/inventory.yml
roles_path           = ./roles
collections_path     = ./collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = ansible.builtin.default
result_format        = yaml
bin_ansible_callbacks = False
callback_whitelist   = profile_tasks, timer

# Config output directory
# Rendered configs will be saved here
# (overridden by generate_configs.yml var: build_dir)
# build_dir = ./build

# Timeout settings (appropriate for network devices)
timeout              = 60
connect_timeout      = 30
command_timeout      = 60

# Forks – number of parallel device connections
forks                = 10

# Log path
log_path             = ./logs/ansible.log

# Vault
vault_password_file  = .vault_pass

[ssh_connection]
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining           = True

[paramiko_connection]
record_host_keys     = False

[persistent_connection]
connect_timeout      = 30
connect_retry_timeout = 15
command_timeout      = 60
