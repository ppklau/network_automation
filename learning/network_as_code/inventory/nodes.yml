        - peer_ip: 10.0.255.8
          remote_asn: 65003
          description: "EVPN Overlay >> dc-border-02"
          update_source: Loopback0
          evpn: true

    dc-leaf-01:
      hostname: dc-leaf-01
      platform: arista_eos
      role: leaf
      bgp_asn: 65001
      loopback0: 10.0.255.3/32
      loopback1: 10.0.254.1/32   # VTEP (shared with MLAG peer)
      mlag:
        domain_id: 1
        peer_link: Port-Channel1
        peer_address: 10.0.253.1/30
        peer_link_members: [Ethernet47, Ethernet48]
        priority: 32767
      vlans_present: [100, 101, 102, 200, 201, 202]
      interfaces:
        - name: Ethernet1
          description: "P2P >> dc-spine-01 Ethernet1"
          ip: 10.0.128.1/31
          mtu: 9214
        - name: Ethernet2
          description: "P2P >> dc-spine-02 Ethernet1"
          ip: 10.0.128.13/31
          mtu: 9214
      bgp_peers:
        - peer_ip: 10.0.128.0
          remote_asn: 65000
          description: "Underlay >> dc-spine-01 Ethernet1"
          evpn: false
        - peer_ip: 10.0.128.12
          remote_asn: 65000
