          mtu: 9214
        - name: Ethernet2
          description: "P2P >> dc-leaf-02 Ethernet1"
          ip: 10.0.128.2/31
          mtu: 9214
        - name: Ethernet3
          description: "P2P >> dc-leaf-03 Ethernet1"
          ip: 10.0.128.4/31
          mtu: 9214
        - name: Ethernet4
          description: "P2P >> dc-leaf-04 Ethernet1"
          ip: 10.0.128.6/31
          mtu: 9214
        - name: Ethernet5
          description: "P2P >> dc-border-01 Ethernet1"
          ip: 10.0.128.8/31
          mtu: 9214
        - name: Ethernet6
          description: "P2P >> dc-border-02 Ethernet1"
          ip: 10.0.128.10/31
          mtu: 9214
        - name: Management0
          description: "OOB Management"
          ip: 10.100.2.11/24
      bgp_peers:
        - peer_ip: 10.0.255.3
          remote_asn: 65001
          description: "EVPN Overlay >> dc-leaf-01"
          update_source: Loopback0
          evpn: true
        - peer_ip: 10.0.255.4
          remote_asn: 65001
          description: "EVPN Overlay >> dc-leaf-02"
          update_source: Loopback0
          evpn: true
        - peer_ip: 10.0.255.5
          remote_asn: 65002
          description: "EVPN Overlay >> dc-leaf-03"
          update_source: Loopback0
          evpn: true
        - peer_ip: 10.0.255.6
          remote_asn: 65002
          description: "EVPN Overlay >> dc-leaf-04"
          update_source: Loopback0
          evpn: true
        - peer_ip: 10.0.255.7
          remote_asn: 65003
          description: "EVPN Overlay >> dc-border-01"
          update_source: Loopback0
          evpn: true
        - peer_ip: 10.0.255.8
