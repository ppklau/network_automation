---
# ============================================================
# ACME Investments - Network as Code
# Source of Truth: Node Definitions, IPAM, VLAN Database
# ============================================================

# ─────────────────────────────────────────────
# GLOBAL FABRIC PARAMETERS
# ─────────────────────────────────────────────
fabric:
  name: acme-investments-dc
  bgp_asn_spine: 65000
  bgp_asn_leaf_base: 65001       # Increments per leaf pair (65001, 65002, ...)
  vxlan_udp_port: 4789
  mtu: 9214
  underlay_protocol: ebgp
  overlay_protocol: evpn
  loopback_block: 10.0.255.0/24  # /32 per device from this pool
  p2p_block: 10.0.128.0/20       # /31 per link from this pool

# ─────────────────────────────────────────────
# VLAN & VNI DATABASE
# Zones: Corporate (100s), Trading (200s), DMZ (300s)
# VNI offset: VLAN_ID + 10000
# ─────────────────────────────────────────────
vlans:
  # --- Corporate Zone ---
  - id: 100
    name: CORP_DATA
    zone: corporate
    description: "Corporate data network – workstations and servers"
    vni: 10100
    vrf: VRF_CORPORATE
    svi_ip_dc: 10.100.0.1/24
    dhcp_helper: 10.0.255.10

  - id: 101
    name: CORP_VOICE
    zone: corporate
    description: "Corporate VoIP – IP telephony"
    vni: 10101
    vrf: VRF_CORPORATE
    svi_ip_dc: 10.100.1.1/24
    dhcp_helper: 10.0.255.10

  - id: 102
    name: CORP_MGMT
    zone: corporate
    description: "Out-of-band management – network devices"
    vni: 10102
    vrf: VRF_CORPORATE
    svi_ip_dc: 10.100.2.1/24
    dhcp_helper: null

  # --- Trading Zone (highest priority, isolated) ---
  - id: 200
    name: TRADING_PROD
    zone: trading
    description: "Production trading systems – order management, execution"
    vni: 10200
    vrf: VRF_TRADING
    svi_ip_dc: 10.200.0.1/24
    dhcp_helper: 10.0.255.20
    qos_policy: TRADING_PRIORITY

  - id: 201
    name: TRADING_MARKET_DATA
    zone: trading
    description: "Market data feeds – read-only multicast consumers"
    vni: 10201
    vrf: VRF_TRADING
    svi_ip_dc: 10.200.1.1/24
    dhcp_helper: 10.0.255.20
    qos_policy: TRADING_PRIORITY

  - id: 202
    name: TRADING_RISK
    zone: trading
    description: "Risk management platform – pre-trade checks"
    vni: 10202
    vrf: VRF_TRADING
    svi_ip_dc: 10.200.2.1/24
    dhcp_helper: 10.0.255.20

  - id: 203
    name: TRADING_DR
    zone: trading
    description: "Trading disaster recovery standby"
    vni: 10203
    vrf: VRF_TRADING
    svi_ip_dc: 10.200.3.1/24
    dhcp_helper: null

  # --- DMZ Zone ---
  - id: 300
    name: DMZ_WEB
    zone: dmz
    description: "Public-facing web / API gateway tier"
    vni: 10300
    vrf: VRF_DMZ
    svi_ip_dc: 10.253.0.1/24
    dhcp_helper: null

  - id: 301
    name: DMZ_PARTNER
    zone: dmz
    description: "Extranet – broker/prime broker connectivity"
    vni: 10301
    vrf: VRF_DMZ
    svi_ip_dc: 10.253.1.1/24
    dhcp_helper: null

  - id: 302
    name: DMZ_MONITORING
    zone: dmz
    description: "Network monitoring and telemetry collectors"
    vni: 10302
    vrf: VRF_DMZ
    svi_ip_dc: 10.253.2.1/24
    dhcp_helper: null

# ─────────────────────────────────────────────
# VRF DEFINITIONS
# ─────────────────────────────────────────────
vrfs:
  - name: VRF_CORPORATE
    rd_base: "65000:100"
    rt_import: ["65000:100"]
    rt_export: ["65000:100"]
    l3vni: 50100
    inter_vrf_routing: false

  - name: VRF_TRADING
    rd_base: "65000:200"
    rt_import: ["65000:200"]
    rt_export: ["65000:200"]
    l3vni: 50200
    inter_vrf_routing: false
    notes: "Strictly isolated. No routing to Corporate or DMZ."

  - name: VRF_DMZ
    rd_base: "65000:300"
    rt_import: ["65000:300"]
    rt_export: ["65000:300"]
    l3vni: 50300
    inter_vrf_routing: false

# ─────────────────────────────────────────────
# DATACENTER DEVICES (Arista EOS)
# ─────────────────────────────────────────────
nodes:
  datacenter:

    dc-spine-01:
      hostname: dc-spine-01
      platform: arista_eos
      role: spine
      bgp_asn: 65000
      loopback0: 10.0.255.1/32
