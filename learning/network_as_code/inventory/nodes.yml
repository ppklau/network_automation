        - peer_ip: 10.0.128.16
          remote_asn: 65000
          description: "Underlay >> dc-spine-02 Ethernet3"
          evpn: false
        - peer_ip: 10.0.255.1
          remote_asn: 65000
          description: "EVPN Overlay >> dc-spine-01"
          update_source: Loopback0
