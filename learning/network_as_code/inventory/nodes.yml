  # ─────────────────────────────────────────────
  # BRANCH DEVICES (Cisco IOS)
  # ─────────────────────────────────────────────
  branch:

    br-lon-rtr-01:
      hostname: br-lon-rtr-01
      platform: cisco_ios
      role: branch_router
      ospf_process: 1
      ospf_area: 0
      wan_ip: 203.0.113.2/30       # Simulated WAN handoff
      wan_gateway: 203.0.113.1
      interfaces:
        - name: GigabitEthernet0/0
          description: "WAN – ISP Handoff (MPLS/Internet)"
          ip: 203.0.113.2/30
          ospf: false
          zone: wan
        - name: GigabitEthernet0/1
          description: "LAN Trunk >> br-lon-sw-01"
          mode: trunk
          ospf: true
          ospf_area: 0
          zone: null
        - name: GigabitEthernet0/1.100
          description: "CORP_DATA subinterface"
          encapsulation_dot1q: 100
          ip: 10.10.100.1/24
          zone: corporate
        - name: GigabitEthernet0/1.200
          description: "TRADING_PROD subinterface"
          encapsulation_dot1q: 200
          ip: 10.10.200.1/24
          zone: trading
        - name: GigabitEthernet0/1.300
          description: "DMZ subinterface"
          encapsulation_dot1q: 300
          ip: 10.10.253.1/24
          zone: dmz
        - name: Loopback0
          description: "Router ID"
          ip: 10.10.0.1/32
          ospf: true
          ospf_area: 0
          zone: null
      acls:
        - name: ACL_TRADING_IN
          type: extended
          description: "Restrict inbound to Trading VLAN – permit only known sources"
          rules:
            - "permit tcp 10.10.100.0 0.0.0.255 10.10.200.0 0.0.0.255 established"
            - "permit tcp 10.10.253.0 0.0.0.255 10.10.200.0 0.0.0.255 eq 443"
            - "deny   ip any 10.10.200.0 0.0.0.255 log"
            - "permit ip any any"
        - name: ACL_DMZ_IN
          type: extended
          description: "DMZ inbound – permit web traffic only"
          rules:
            - "permit tcp any 10.10.253.0 0.0.0.255 eq 443"
            - "permit tcp any 10.10.253.0 0.0.0.255 eq 80"
            - "deny   ip any 10.10.253.0 0.0.0.255 log"
            - "permit ip any any"
        - name: ACL_WAN_IN
          type: extended
          description: "WAN inbound – deny RFC1918, permit return traffic"
          rules:
            - "deny   ip 10.0.0.0 0.255.255.255 any log"
            - "deny   ip 172.16.0.0 0.15.255.255 any log"
            - "deny   ip 192.168.0.0 0.0.255.255 any log"
            - "permit tcp any any established"
            - "deny   ip any any log"

    br-lon-sw-01:
      hostname: br-lon-sw-01
      platform: cisco_ios
      role: branch_switch
      ospf_process: 1
      ospf_area: 0
      vlans:
        - id: 100
          name: CORP_DATA
        - id: 200
          name: TRADING_PROD
        - id: 300
          name: DMZ_WEB
        - id: 999
          name: NATIVE_UNUSED
      interfaces:
        - name: GigabitEthernet0/1
          description: "Uplink >> br-lon-rtr-01"
          mode: trunk
          allowed_vlans: "100,200,300"
          native_vlan: 999
        - name: GigabitEthernet0/2
          description: "Access >> Trading Workstation 1"
          mode: access
          vlan: 200
        - name: GigabitEthernet0/3
          description: "Access >> Corporate Workstation 1"
          mode: access
          vlan: 100
        - name: GigabitEthernet0/24
          description: "Trunk >> br-lon-ap-01 (wireless)"
          mode: trunk
          allowed_vlans: "100,200"
          native_vlan: 999
        - name: Vlan100
          description: "SVI CORP_DATA"
          ip: 10.10.100.2/24
          gateway: 10.10.100.1
          mode: null
        - name: Vlan200
          description: "SVI TRADING_PROD"
          ip: 10.10.200.2/24
          gateway: 10.10.200.1
          mode: null
