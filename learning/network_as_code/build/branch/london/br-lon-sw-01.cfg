! ============================================================
version 15.7
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname br-lon-sw-01
!
boot-start-marker
boot-end-marker
!
! --- AAA ---
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username netadmin privilege 15 secret 9 demoPASS123
!
! --- Global IP settings ---
ip routing
ip cef
ip classless
ip tcp adjust-mss 1452
no ip http server
no ip http secure-server
no ip domain lookup
ip domain name acme-investments.internal
ip name-server 10.100.2.50
ip name-server 10.100.2.51
!

! ─────────────────────────────────────────────
! BRANCH SWITCH SPECIFIC CONFIGURATION
! ─────────────────────────────────────────────

! --- Spanning Tree ---
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 100 priority 24576
spanning-tree vlan 200 priority 24576
spanning-tree vlan 300 priority 24576
spanning-tree vlan 999 priority 24576
!

! --- VLAN Database ---
vlan 100
 name CORP_DATA
!
vlan 200
 name TRADING_PROD
!
vlan 300
 name DMZ_WEB
!
vlan 999
 name NATIVE_UNUSED
!

! --- Interfaces ---
interface GigabitEthernet0/1
 description Uplink >> br-lon-rtr-01
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 100,200,300
 switchport mode trunk
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet0/2
 description Access >> Trading Workstation 1
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 20
 no shutdown
!
interface GigabitEthernet0/3
 description Access >> Corporate Workstation 1
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 20
 no shutdown
!
interface GigabitEthernet0/24
 description Trunk >> br-lon-ap-01 (wireless)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 100,200
 switchport mode trunk
 spanning-tree portfast trunk
 no shutdown
!
interface Vlan100
 description SVI CORP_DATA
 ip address 10.10.100.2 255.255.255.0
 ip default-gateway 10.10.100.1
 no shutdown
!
interface Vlan200
 description SVI TRADING_PROD
 ip address 10.10.200.2 255.255.255.0
 ip default-gateway 10.10.200.1
 no shutdown
!

! --- OSPF ---
router ospf 1
 router-id 10.10.0.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.100.0 0.0.0.255 area 0
 network 10.10.200.0 0.0.0.255 area 0
 area 0 authentication message-digest
!


! --- NTP ---
ntp server 10.100.2.100 prefer
ntp server 10.100.2.101
clock timezone GMT 0
!
! --- Logging ---
logging buffered 65536 informational
logging trap informational
logging host 10.253.2.10
logging source-interface Loopback0
!
! --- SNMP ---
snmp-server community ACME-RO RO
snmp-server location "ACME Investments – London Branch – BRANCH_SWITCH"
snmp-server contact "NOC – noc@acme-investments.com"
snmp-server host 10.253.2.11 version 2c ACME-RO
!
! --- SSH / VTY ---
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 exec-timeout 5 0
!
line vty 0 15
 exec-timeout 10 0
 transport input ssh
 logging synchronous
!
end
