! ─────────────────────────────────────────────
! BRANCH ROUTER SPECIFIC CONFIGURATION
! ─────────────────────────────────────────────

! --- Access Control Lists ---
!
! ACL: ACL_TRADING_IN – Restrict inbound to Trading VLAN – permit only known sources
ip access-list extended ACL_TRADING_IN
 permit tcp 10.10.100.0 0.0.0.255 10.10.200.0 0.0.0.255 established
 permit tcp 10.10.253.0 0.0.0.255 10.10.200.0 0.0.0.255 eq 443
 deny   ip any 10.10.200.0 0.0.0.255 log
 permit ip any any
!
!
! ACL: ACL_DMZ_IN – DMZ inbound – permit web traffic only
ip access-list extended ACL_DMZ_IN
 permit tcp any 10.10.253.0 0.0.0.255 eq 443
 permit tcp any 10.10.253.0 0.0.0.255 eq 80
 deny   ip any 10.10.253.0 0.0.0.255 log
 permit ip any any
!
!
! ACL: ACL_WAN_IN – WAN inbound – deny RFC1918, permit return traffic
ip access-list extended ACL_WAN_IN
 deny   ip 10.0.0.0 0.255.255.255 any log
 deny   ip 172.16.0.0 0.15.255.255 any log
 deny   ip 192.168.0.0 0.0.255.255 any log
 permit tcp any any established
 deny   ip any any log
!

! --- Interfaces ---
interface GigabitEthernet0/0
 description WAN – ISP Handoff (MPLS/Internet)
 ip address 203.0.113.2 255.255.255.252
 ip access-group ACL_WAN_IN in
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Trunk >> br-lon-sw-01
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.100
 description CORP_DATA subinterface
 ip address 10.10.100.1 255.255.255.0
 encapsulation dot1Q 100
 ip address 10.10.100.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1.200
 description TRADING_PROD subinterface
 ip address 10.10.200.1 255.255.255.0
 encapsulation dot1Q 200
 ip address 10.10.200.1 255.255.255.0
 ip access-group ACL_TRADING_IN in
 no shutdown
!
interface GigabitEthernet0/1.300
 description DMZ subinterface
 ip address 10.10.253.1 255.255.255.0
 encapsulation dot1Q 300
 ip address 10.10.253.1 255.255.255.0
 ip access-group ACL_DMZ_IN in
 no shutdown
!
interface Loopback0
 description Router ID
 ip address 10.10.0.1 255.255.255.255
 no shutdown
!

! --- OSPF ---
